name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: datastream_matrix_test
          POSTGRES_USER: datastream_user
          POSTGRES_PASSWORD: datastream_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U datastream_user -d datastream_matrix_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:8
        ports:
          - 6379:6379

      mongodb:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: mongo_user
          MONGO_INITDB_ROOT_PASSWORD: mongo_password
        ports:
          - 27017:27017

    env:
      DJANGO_SETTINGS_MODULE: config.settings.docker
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: False
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173

      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: datastream_matrix_test
      POSTGRES_USER: datastream_user
      POSTGRES_PASSWORD: datastream_password

      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

      MONGODB_ROOT_USERNAME: mongo_user
      MONGODB_ROOT_PASSWORD: mongo_password
      MONGODB_URI: mongodb://mongo_user:mongo_password@localhost:27017
      MONGODB_DATABASE: datastream_matrix_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Run backend tests
        run: python manage.py test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build