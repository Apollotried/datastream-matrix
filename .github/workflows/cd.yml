name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail_key
          chmod 600 ~/.ssh/lightsail_key

      - name: Trust Lightsail host
        run: |
          ssh-keyscan -H "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/lightsail_key "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" <<'EOF'
            cd ~/ProjectM
            git fetch origin
            git reset --hard origin/main
            docker compose --env-file .env.production -f docker-compose.prod.yml up --build -d
            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T web python manage.py migrate
            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T web python manage.py collectstatic --noinput
          EOF
